<!DOCTYPE html>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#ffffff;
  --bg-soft:#f8f8ff;
  --ink:#111827;
  --ink-soft:#65708a;
  --line:#dfe3f4;
  --grad:linear-gradient(115deg,#9144ff 0%,#4b4de8 47%,#1266e8 100%);
  --pad:clamp(20px,4vw,48px);
  --gap:20px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-weight:400;font-size:16px;line-height:1.6;letter-spacing:-.01em;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid #1266e8;outline-offset:3px}

.eyebrow{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.08em;color:#1266e8;text-transform:uppercase;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:15px 26px;border-radius:12px;font-weight:700;font-size:15px;white-space:nowrap}
.btn-grad{background:var(--grad);color:#fff}
.btn-grad:hover{opacity:.92}
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--pad)}

/* ── 상단 바 ── */
.bar{
  position:fixed;top:0;left:0;right:0;height:76px;z-index:80;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--pad);background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.bar .logo{font-weight:800;font-size:18px}
.bar nav{display:flex;align-items:center;gap:28px}
.bar nav a{font-size:15px;color:var(--ink-soft)}
.bar nav a:hover{color:var(--ink)}
@media(max-width:900px){ .bar nav{display:none} }

/* ── 페이지 머리 ── */
.page-head{padding:calc(76px + clamp(48px,8vw,80px)) 0 0}
.page-head h1{font-size:clamp(34px,5vw,56px);font-weight:800;letter-spacing:-.02em;line-height:1.15;word-break:keep-all}
.page-head p{margin-top:18px;color:var(--ink-soft);font-size:17px}

/* ── 영상 타일 ── */
.sec{padding-top:clamp(40px,6vw,64px)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap);row-gap:clamp(32px,5vw,48px);align-items:start}
.ph{aspect-ratio:9/16;overflow:hidden;border-radius:16px;border:1px solid var(--line);background:var(--bg-soft)}
.ph video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
.cap{padding-top:14px}
.cap h3{font-size:16px;font-weight:700;line-height:1.3}
.cap p{color:var(--ink-soft);font-size:13px;margin-top:2px}

/* ── Final CTA ── */
.final-cta{border-radius:32px;background:var(--grad);padding:clamp(48px,8vw,88px) clamp(28px,6vw,72px);color:#fff;text-align:center}
.final-cta h2{font-size:clamp(28px,4.2vw,44px);font-weight:800;line-height:1.3;word-break:keep-all}
.final-links{margin-top:28px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.final-links a{padding:13px 22px;border-radius:12px;background:rgba(255,255,255,.16);font-weight:700;font-size:14px;border:1px solid rgba(255,255,255,.3);color:#fff}
.final-links a:hover{background:rgba(255,255,255,.26)}

footer{
  display:flex;justify-content:space-between;gap:var(--gap);flex-wrap:wrap;
  padding:16px var(--pad);border-top:1px solid var(--line);color:var(--ink-soft);font-size:13px;
}
footer b{color:var(--ink);font-weight:800}

@media(max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
