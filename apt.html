<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#0f172a;color:#fff;line-height:1.7}
a{text-decoration:none;color:inherit}

header{
background:#020617;
padding:20px 32px;
display:flex;
align-items:center;
gap:16px;
border-bottom:1px solid rgba(255,255,255,.08);
}

.back-btn{
display:inline-flex;
align-items:center;
gap:8px;
color:#f97316;
font-size:16px;
font-weight:700;
}

.back-btn:hover{opacity:.8}

header h1{
font-size:20px;
font-weight:700;
color:#fff;
}

.section{
max-width:1200px;
margin:auto;
padding:60px 24px;
}

.section h2{
font-size:32px;
margin-bottom:8px;
}

.section .sub{
color:#94a3b8;
font-size:16px;
margin-bottom:40px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:28px;
}

.vcard{
background:#1e293b;
border-radius:18px;
border:1px solid rgba(255,255,255,.08);
overflow:hidden;
}

.vcard video{
width:100%;
display:block;
background:#000;
max-height:500px;
object-fit:contain;
}

.vcard .vthumb{
width:100%;
aspect-ratio:9/16;
background:linear-gradient(135deg,#1e293b,#0f172a);
display:flex;
align-items:center;
justify-content:center;
font-size:56px;
}

.vcard a.vthumb{
display:flex;
cursor:pointer;
transition:opacity .2s;
}

.vcard a.vthumb:hover{opacity:.8}

.vinfo{padding:20px}
.vinfo h3{font-size:18px;font-weight:700;margin-bottom:6px;color:#fff}
.vinfo p{color:#94a3b8;font-size:14px;line-height:1.6}

.ptag{
display:inline-block;
font-size:11px;
padding:3px 10px;
border-radius:20px;
margin-bottom:10px;
font-weight:700;
}
.ptag-video{background:rgba(249,115,22,.15);color:#f97316}
.ptag-link{background:rgba(99,102,241,.15);color:#818cf8}

footer{
text-align:center;
padding:30px;
background:#020617;
color:#94a3b8;
border-top:1px solid rgba(255,255,255,.06);
}

@media(max-width:600px){
.grid{grid-template-columns:1fr}
header h1{font-size:16px}
}
</style>
</head>
